# Build for our own computer (x86_64-redstone.json), not for Linux, and
# build Rust's `core` library for it too.
[unstable]
json-target-spec = true
build-std-features = ["compiler-builtins-mem"]
build-std = ["core", "compiler_builtins"]

[build]
target = "x86_64-redstone.json"

# `cargo run` makes a disk image and starts it in QEMU.
[target.'cfg(target_os = "none")']
runner = "bootimage runner"

# Hide a warning about Rust's own `core` library, which we can't change.
[future-incompat-report]
frequency = "never"
